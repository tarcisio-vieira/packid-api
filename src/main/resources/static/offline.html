<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#263746" />
  <title>VSGI Condomínio - Sem conexão</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f6f7f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2933}
    main{width:min(100%,420px);background:#fff;border:1px solid #dde2e7;border-radius:24px;padding:28px;text-align:center;box-shadow:0 16px 45px rgba(20,32,48,.08)}
    .icon{width:58px;height:58px;margin:0 auto 16px;border-radius:16px;background:#263746;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}
    h1{margin:0 0 8px;font-size:22px} p{margin:0;color:#66717d;line-height:1.5} button{margin-top:22px;border:0;border-radius:12px;background:#1976d2;color:#fff;padding:12px 20px;font-weight:700;font-size:15px}
  </style>
</head>
<body>
  <main>
    <div class="icon">V</div>
    <h1>Sem conexão com a internet</h1>
    <p>O Portal do Morador precisa de conexão para consultar dados e registrar solicitações. Verifique sua internet e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
