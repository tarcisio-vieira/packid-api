server:
  port: 8081
  address: 127.0.0.1
  servlet:
    context-path: /packid
    session:
      timeout: 24h
      cookie:
        max-age: 24h
        http-only: true
        secure: true
        same-site: lax
  forward-headers-strategy: framework
  tomcat:
    redirect-context-root: false
    # O acesso HTTP não precisa ser registrado pelo Tomcat em produção.
    # As consultas de polling (pending/pickup-requests) ocorrem a cada 5s e
    # não devem poluir os logs da aplicação.
    accesslog:
      enabled: false

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/packid}
    username: ${DB_USER:packid_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    # Produção: registra apenas avisos/erros das bibliotecas/frameworks.
    # Evita log repetitivo de requisições HTTP, inclusive os pollings de 5s.
    root: WARN
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    liquibase: WARN

    # Mantém os logs funcionais do próprio sistema (envio de WhatsApp,
    # integrações e situações relevantes) sem habilitar DEBUG/TRACE.
    com.packid.api: INFO

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}