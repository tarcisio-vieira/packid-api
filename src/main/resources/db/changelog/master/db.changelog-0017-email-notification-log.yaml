databaseChangeLog:
  - changeSet:
      id: 0017-email-notification-log
      author: vsgi
      changes:
        - createTable:
            tableName: email_notification_log
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: block
                  type: varchar(30)
              - column:
                  name: apartment
                  type: varchar(30)
              - column:
                  name: recipient_email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: sender_email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: change_type
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text
              - column:
                  name: sent_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(150)
              - column:
                  name: deleted_by
                  type: varchar(150)
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: email_notification_log
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_email_notification_log_tenant
            onDelete: RESTRICT
        - createIndex:
            tableName: email_notification_log
            indexName: idx_email_notification_log_unit_date
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: block
              - column:
                  name: apartment
              - column:
                  name: created_at
        - createIndex:
            tableName: email_notification_log
            indexName: idx_email_notification_log_status
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: status
              - column:
                  name: created_at
