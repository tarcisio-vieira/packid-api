databaseChangeLog:
  - changeSet:
      id: 0014-registry-entry-visitor-and-access-history
      author: packid
      changes:
        - addUniqueConstraint:
            tableName: registry_entry
            columnNames: tenant_id,id
            constraintName: uk_registry_entry_tenant_id

        - createIndex:
            tableName: registry_entry
            indexName: idx_registry_entry_tenant_type_document
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: entry_type
              - column:
                  name: document

        - createTable:
            tableName: visitor_visit
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: visitor_registry_entry_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: block
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: apartment
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: visited_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(150)
              - column:
                  name: deleted_by
                  type: varchar(150)
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: visitor_visit
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_visitor_visit_tenant
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: visitor_visit
            baseColumnNames: tenant_id,visitor_registry_entry_id
            referencedTableName: registry_entry
            referencedColumnNames: tenant_id,id
            constraintName: fk_visitor_visit_registry_same_tenant
            onDelete: RESTRICT
        - createIndex:
            tableName: visitor_visit
            indexName: idx_visitor_visit_unit_date
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: block
              - column:
                  name: apartment
              - column:
                  name: visited_at
        - createIndex:
            tableName: visitor_visit
            indexName: idx_visitor_visit_visitor
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: visitor_registry_entry_id

        - createTable:
            tableName: delivery_record
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: delivery_person_registry_entry_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: block
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: apartment
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: delivered_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: authorized_to_enter
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(150)
              - column:
                  name: deleted_by
                  type: varchar(150)
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: delivery_record
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_delivery_record_tenant
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: delivery_record
            baseColumnNames: tenant_id,delivery_person_registry_entry_id
            referencedTableName: registry_entry
            referencedColumnNames: tenant_id,id
            constraintName: fk_delivery_record_registry_same_tenant
            onDelete: RESTRICT
        - createIndex:
            tableName: delivery_record
            indexName: idx_delivery_record_unit_date
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: block
              - column:
                  name: apartment
              - column:
                  name: delivered_at
        - createIndex:
            tableName: delivery_record
            indexName: idx_delivery_record_delivery_person
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: delivery_person_registry_entry_id
