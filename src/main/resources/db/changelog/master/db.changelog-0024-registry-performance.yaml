databaseChangeLog:
  - changeSet:
      id: 0024-registry-performance-indexes
      author: packid
      changes:
        - createIndex:
            tableName: registry_entry
            indexName: idx_registry_entry_tenant_type_status_name
            columns:
              - column: { name: tenant_id }
              - column: { name: entry_type }
              - column: { name: deleted }
              - column: { name: active }
              - column: { name: name }
        - createIndex:
            tableName: registry_entry
            indexName: idx_registry_entry_tenant_type_unit_status
            columns:
              - column: { name: tenant_id }
              - column: { name: entry_type }
              - column: { name: deleted }
              - column: { name: active }
              - column: { name: block }
              - column: { name: apartment }
