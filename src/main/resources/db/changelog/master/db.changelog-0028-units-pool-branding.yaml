databaseChangeLog:
  - changeSet:
      id: 0028-units-pool-branding
      author: openai
      changes:
        - addColumn:
            tableName: residential_unit
            columns:
              - column:
                  name: block
                  type: varchar(30)
              - column:
                  name: apartment
                  type: varchar(30)
        - sql:
            splitStatements: false
            sql: |
              UPDATE residential_unit
                 SET block = CASE
                       WHEN code ~ '^[A-Za-z0-9]+$' AND length(code) >= 4 THEN substring(code from 1 for 1)
                       ELSE block
                     END,
                     apartment = CASE
                       WHEN code ~ '^[A-Za-z0-9]+$' AND length(code) >= 4 THEN substring(code from 2)
                       ELSE apartment
                     END
               WHERE (block IS NULL OR apartment IS NULL)
                 AND deleted = false;
        - sql:
            splitStatements: false
            sql: |
              WITH registry_units AS (
                SELECT DISTINCT tenant_id, trim(block) AS block, trim(apartment) AS apartment
                  FROM registry_entry
                 WHERE deleted = false
                   AND block IS NOT NULL AND trim(block) <> ''
                   AND apartment IS NOT NULL AND trim(apartment) <> ''
              )
              INSERT INTO residential_unit
                (id, tenant_id, condominium_id, code, name, block, apartment, active, created_at, created_by, deleted)
              SELECT
                gen_random_uuid(),
                u.tenant_id,
                c.id,
                left(regexp_replace(u.block || u.apartment, '[^A-Za-z0-9._-]', '', 'g'), 30),
                'Bloco ' || u.block || ' Apto ' || u.apartment,
                u.block,
                u.apartment,
                true,
                CURRENT_TIMESTAMP,
                'migration-0028',
                false
              FROM registry_units u
              JOIN LATERAL (
                SELECT id
                  FROM condominium c0
                 WHERE c0.tenant_id = u.tenant_id AND c0.deleted = false
                 ORDER BY c0.created_at NULLS LAST, c0.id
                 LIMIT 1
              ) c ON true
              WHERE NOT EXISTS (
                SELECT 1 FROM residential_unit ru
                 WHERE ru.tenant_id = u.tenant_id
                   AND ru.deleted = false
                   AND lower(trim(coalesce(ru.block, ''))) = lower(u.block)
                   AND lower(trim(coalesce(ru.apartment, ''))) = lower(u.apartment)
              )
              AND NOT EXISTS (
                SELECT 1 FROM residential_unit ru2
                 WHERE ru2.tenant_id = u.tenant_id
                   AND ru2.condominium_id = c.id
                   AND ru2.deleted = false
                   AND lower(ru2.code) = lower(left(regexp_replace(u.block || u.apartment, '[^A-Za-z0-9._-]', '', 'g'), 30))
              );

        - sql:
            sql: |
              CREATE INDEX idx_residential_unit_tenant_block_apartment
              ON residential_unit (tenant_id, lower(block), lower(apartment))
              WHERE block IS NOT NULL AND apartment IS NOT NULL AND deleted = false;

        - addColumn:
            tableName: condominium
            columns:
              - column: { name: logo_drive_file_id, type: varchar(255) }
              - column: { name: logo_mime_type, type: varchar(100) }
              - column: { name: logo_file_name, type: varchar(255) }
              - column: { name: logo_owner_email, type: varchar(255) }
              - column:
                  name: pool_card_title
                  type: varchar(80)
                  defaultValue: PISCINA
                  constraints: { nullable: false }
              - column:
                  name: pool_card_subtitle
                  type: varchar(120)
                  defaultValue: USO DA PISCINA
                  constraints: { nullable: false }
              - column:
                  name: pool_opening_hours
                  type: varchar(300)
                  defaultValue: Todos os dias das 09h às 17h.
              - column:
                  name: pool_show_opening_hours
                  type: boolean
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: pool_closed_days_message
                  type: varchar(400)
                  defaultValue: Toda segunda-feira fechada para tratamento e manutenção de fundo.
              - column:
                  name: pool_show_closed_days
                  type: boolean
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: pool_validity_months
                  type: integer
                  defaultValueNumeric: 6
                  constraints: { nullable: false }
              - column:
                  name: pool_validity_message
                  type: varchar(500)
                  defaultValue: A carteirinha terá validade de 06 meses, com necessária apresentação do exame médico atualizado para validação.
              - column:
                  name: pool_show_validity_message
                  type: boolean
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: pool_general_info
                  type: varchar(500)
                  defaultValue: Regras da Piscina são regidas pelo Regulamento Interno e Decreto 4.447/81.
              - column:
                  name: pool_show_general_info
                  type: boolean
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: pool_additional_info
                  type: varchar(160)
                  defaultValue: Administração
              - column:
                  name: pool_card_color
                  type: varchar(20)
                  defaultValue: '#0B5C2B'
                  constraints: { nullable: false }

        - createTable:
            tableName: pool_card
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: tenant_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: resident_registry_entry_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: issue_date
                  type: date
                  constraints: { nullable: false }
              - column:
                  name: validity_months
                  type: integer
                  constraints: { nullable: false }
              - column:
                  name: valid_until
                  type: date
                  constraints: { nullable: false }
              - column:
                  name: under_ten
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column: { name: medical_report_drive_file_id, type: varchar(255) }
              - column: { name: medical_report_mime_type, type: varchar(100) }
              - column: { name: medical_report_file_name, type: varchar(255) }
              - column: { name: medical_report_owner_email, type: varchar(255) }
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
              - column: { name: updated_at, type: timestamp }
              - column: { name: deleted_at, type: timestamp }
              - column:
                  name: created_by
                  type: varchar(150)
                  constraints: { nullable: false }
              - column: { name: updated_by, type: varchar(150) }
              - column: { name: deleted_by, type: varchar(150) }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: pool_card
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_pool_card_tenant
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: pool_card
            baseColumnNames: resident_registry_entry_id
            referencedTableName: registry_entry
            referencedColumnNames: id
            constraintName: fk_pool_card_resident_registry
            onDelete: RESTRICT
        - createIndex:
            tableName: pool_card
            indexName: idx_pool_card_tenant_resident
            columns:
              - column: { name: tenant_id }
              - column: { name: resident_registry_entry_id }
        - createIndex:
            tableName: pool_card
            indexName: idx_pool_card_valid_until
            columns:
              - column: { name: tenant_id }
              - column: { name: valid_until }

  - changeSet:
      id: 0028-packid-pickup-index
      author: openai
      changes:
        - createIndex:
            tableName: pack_id
            indexName: idx_pack_id_pickup_pending
            columns:
              - column: { name: tenant_id }
              - column: { name: resident_acknowledged_at }
              - column: { name: handed_over_at }
