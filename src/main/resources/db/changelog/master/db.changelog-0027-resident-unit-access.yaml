databaseChangeLog:
  - changeSet:
      id: 0027-resident-unit-access
      author: openai
      changes:
        - addColumn:
            tableName: apartment_occupancy
            columns:
              - column:
                  name: resident_access_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: resident_username
                  type: varchar(100)
              - column:
                  name: resident_password_hash
                  type: varchar(255)
              - column:
                  name: resident_must_change_password
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: credential_email_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addColumn:
            tableName: condominium
            columns:
              - column:
                  name: resident_credential_emails_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            splitStatements: false
            sql: |
              UPDATE apartment_occupancy ao
                 SET resident_access_enabled = true,
                     resident_username = CASE
                       WHEN length(regexp_replace(coalesce(ao.block, '') || coalesce(ao.apartment, ''), '[^A-Za-z0-9._-]', '', 'g')) >= 4
                         THEN lower(regexp_replace(coalesce(ao.block, '') || coalesce(ao.apartment, ''), '[^A-Za-z0-9._-]', '', 'g'))
                       ELSE 'unidade' || lower(regexp_replace(coalesce(ao.block, '') || coalesce(ao.apartment, ''), '[^A-Za-z0-9._-]', '', 'g'))
                     END,
                     resident_password_hash = src.resident_password_hash,
                     resident_must_change_password = true
                FROM (
                  SELECT DISTINCT ON (occupancy_id)
                         occupancy_id, resident_username, resident_password_hash
                    FROM registry_entry
                   WHERE entry_type = 'RESIDENT'
                     AND deleted = false
                     AND active = true
                     AND occupancy_id IS NOT NULL
                     AND resident_username IS NOT NULL
                     AND resident_password_hash IS NOT NULL
                   ORDER BY occupancy_id, updated_at DESC NULLS LAST, created_at DESC NULLS LAST
                ) src
               WHERE ao.id = src.occupancy_id;
        - sql:
            sql: |
              CREATE UNIQUE INDEX uq_apartment_occupancy_tenant_resident_username
              ON apartment_occupancy (tenant_id, lower(resident_username))
              WHERE resident_username IS NOT NULL AND deleted = false;
