databaseChangeLog:
  - changeSet:
      id: 0019-service-providers
      author: vsgi
      changes:
        - createTable:
            tableName: service_company
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: uuid, constraints: { nullable: false } }
              - column: { name: name, type: varchar(200), constraints: { nullable: false } }
              - column: { name: trade_name, type: varchar(200) }
              - column: { name: document_number, type: varchar(40) }
              - column: { name: phone, type: varchar(40) }
              - column: { name: email, type: varchar(255) }
              - column: { name: contact_name, type: varchar(200) }
              - column: { name: address_line, type: varchar(300) }
              - column: { name: city, type: varchar(120) }
              - column: { name: state, type: varchar(60) }
              - column: { name: zip_code, type: varchar(20) }
              - column: { name: notes, type: text }
              - column: { name: active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp }
              - column: { name: deleted_at, type: timestamp }
              - column: { name: created_by, type: varchar(150), constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(150) }
              - column: { name: deleted_by, type: varchar(150) }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: service_company
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_service_company_tenant
            onDelete: CASCADE
        - createIndex:
            tableName: service_company
            indexName: idx_service_company_tenant_name
            columns:
              - column: { name: tenant_id }
              - column: { name: name }

        - addColumn:
            tableName: registry_entry
            columns:
              - column: { name: service_company_id, type: uuid }
              - column: { name: cpf_photo_drive_file_id, type: varchar(255) }
              - column: { name: cpf_photo_mime_type, type: varchar(100) }
              - column: { name: cpf_photo_file_name, type: varchar(255) }
              - column: { name: cpf_photo_owner_email, type: varchar(255) }
              - column: { name: rg_photo_drive_file_id, type: varchar(255) }
              - column: { name: rg_photo_mime_type, type: varchar(100) }
              - column: { name: rg_photo_file_name, type: varchar(255) }
              - column: { name: rg_photo_owner_email, type: varchar(255) }
        - addForeignKeyConstraint:
            baseTableName: registry_entry
            baseColumnNames: service_company_id
            referencedTableName: service_company
            referencedColumnNames: id
            constraintName: fk_registry_entry_service_company
            onDelete: SET NULL
        - createIndex:
            tableName: registry_entry
            indexName: idx_registry_entry_service_company
            columns:
              - column: { name: tenant_id }
              - column: { name: service_company_id }

        - createTable:
            tableName: service_record
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: uuid, constraints: { nullable: false } }
              - column: { name: service_provider_registry_entry_id, type: uuid, constraints: { nullable: false } }
              - column: { name: service_company_id, type: uuid }
              - column: { name: service_scope, type: varchar(20), constraints: { nullable: false } }
              - column: { name: block, type: varchar(30) }
              - column: { name: apartment, type: varchar(30) }
              - column: { name: performed_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: service_description, type: varchar(500), constraints: { nullable: false } }
              - column: { name: notes, type: text }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp }
              - column: { name: deleted_at, type: timestamp }
              - column: { name: created_by, type: varchar(150), constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(150) }
              - column: { name: deleted_by, type: varchar(150) }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: service_record
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
            constraintName: fk_service_record_tenant
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: service_record
            baseColumnNames: service_provider_registry_entry_id
            referencedTableName: registry_entry
            referencedColumnNames: id
            constraintName: fk_service_record_provider
        - addForeignKeyConstraint:
            baseTableName: service_record
            baseColumnNames: service_company_id
            referencedTableName: service_company
            referencedColumnNames: id
            constraintName: fk_service_record_company
            onDelete: SET NULL
        - createIndex:
            tableName: service_record
            indexName: idx_service_record_unit_date
            columns:
              - column: { name: tenant_id }
              - column: { name: block }
              - column: { name: apartment }
              - column: { name: performed_at }
        - createIndex:
            tableName: service_record
            indexName: idx_service_record_provider_date
            columns:
              - column: { name: tenant_id }
              - column: { name: service_provider_registry_entry_id }
              - column: { name: performed_at }
